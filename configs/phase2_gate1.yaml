# 第二阶段 · 闸门 1 配置 —— 已准备，**未运行**。不在 OSF 注册的 stage-1 协议之内。
# 问题：同一段求解器推导，在四种写法下，SFT 后模型能否学会生成它并据此答对？（写法 = 唯一变量）
# 渲染器与连接词映射冻结于 commit f887662（cot_compress/derivation.py；ops/phase2_templates.md）。
# 标 "TBD-用户" 的项未定；标 "默认" 的项是 planning-led 的选择，照抄 B_warm-SFT 的设置，待用户确认。

base_config: configs/cloud_4b.yaml          # 模型 Qwen3-4B bf16、LoRA r32 α64 attention+MLP（D5）、vLLM util 0.35（D20）
key: ord_n8_h4_d5
notations: [N1, N2, N2s, N3]
seeds: [1, 2]                               # 每种写法 2 个 seed（seed 定数据顺序与 LoRA 初始化）→ 共 8 个 run

train:
  data:                                     # scripts/phase2_build_sft.py 产出；train 划分 2000 题；sha256 见 data/phase2/manifest.json
    N1:  data/phase2/gate1_sft_N1.jsonl
    N2:  data/phase2/gate1_sft_N2.jsonl
    N2s: data/phase2/gate1_sft_N2s.jsonl
    N3:  data/phase2/gate1_sft_N3.jsonl
  row_format: "prompt = stage-1 IR 题面（chat 模板 + <think>\\n 预填，同 stage-1）；completion = 推导 + \\n</think>\\n\\n<answer>σ</answer>"
  method: sft_fresh_lora                    # 与 B_warm-SFT 相同：新 adapter，completion-only loss
  learning_rate: 1.0e-5                     # 默认（= cloud_4b.yaml train.learning_rate，B_warm-SFT 同）
  warmup_steps: 10                          # 默认（B_warm-SFT 同）
  per_device_train_batch_size: 1            # 默认（B_warm-SFT 同）
  gradient_accumulation_steps: 16           # 默认：16 条 / 步
  max_steps: 250                            # 默认：固定步数，四种写法相同 = 4000 条 = train 2000 题 × 2 遍（B_warm-SFT 是 2 epoch）
  save: final_only

eval:
  set: data/ordering/ord_n8_h4_d5_p2eval_seed1.json   # 新评估集 500 题，seed 1，与 stage-1 全部划分不相交
  sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, n: 1}   # 同 stage-1 eval
  cap: 10240                                # 同 stage-1（同一仪器）；推导中位 134–294 token，远低于 cap
  mask:                                     # N3 在 B 的字母屏蔽下评估；其余不屏蔽
    N1: none
    N2: none
    N2s: none
    N3: letterfree
  metrics:                                  # 描述量；哪个进判据由用户定
    - acc                                   # 最终答案 exact match（tasks.ordering.check）
    - think_tokens                          # 生成推导的长度
    - parse_rate                            # 生成的 think 段能被 derivation.parse 按该写法解析的比例
    - sound_rate                            # 解析后 derivation.verify 通过（每条链每一环都是当时可用的约束）的比例
    - exact_derivation_rate                 # 生成推导与该题的规范推导逐步相同的比例
    - letter_frac                           # think 段字母占比（N3 应为 0）
    - capped_rate
  also_report: frozen_model_same_eval       # 冻结模型在同一评估集上的 native / direct（基线）

gate_criterion: TBD-用户                    # 例如"某写法 acc ≥ X 且 sound_rate ≥ Y"——未定，不在此预设

cost_estimate_usd:                          # $1.6/h；未实测
  per_run_hours: [0.4, 1.7]                 # SFT 250 步（短序列）约 15–25 min + 模型加载；eval 500 题：推导正常约 5 min，若模型不收尾而写到 cap 则约 80 min（B1 / E2 实测）
  total_8_runs: [5, 22]
  plus_frozen_baseline: [1, 2]

missing_before_run:                         # 已知缺口（未写代码，按指示只准备配置）
  - runner：scripts/11_sft_warm.py 的训练部分可直接复用，但它在内部调用 warm 变换（make_sft_rows）并把 run 命名为 Bwarm_sft_*；需要一个读取上述 jsonl、按 max_steps（而非 epochs）训练的变体
  - eval 集覆盖：scripts/train.py --eval-only 固定用 stop 划分（make_eval_set split="stop"），需要一个读取 p2eval 文件的入口
  - 新增 eval 指标 parse_rate / sound_rate / exact_derivation_rate 需接 cot_compress.derivation
